<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ app_name }} · 轮询生产</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo">↻</span><div><div class="brand-name">{{ app_name }}</div><div class="brand-sub">轮询生产</div></div></div>
  <nav class="page-nav"><a href="/">首页</a><a href="/mailbox">邮箱池子</a><a href="/claims">领取邮箱</a><a href="/production">生产</a><a class="active" href="/production-loop">轮询生产</a></nav>
  <div class="topbar-actions">
    <button id="btnSettings" class="btn btn-ghost" type="button" aria-expanded="false" title="界面设置">设置</button>
    {% if auth_user %}
    <span class="topbar-user-name">{{ auth_user }}</span>
    <a class="btn btn-ghost nav-button" href="/logout">退出</a>
    {% endif %}
  </div>
</header>

<main class="loop-page">
  <section class="loop-control-band">
    <div class="col-head">
      <h1>轮询控制</h1>
      <span id="loopStatusTag" class="tag tag-muted">已停止</span>
    </div>
    <form id="loopForm" class="loop-config">
      <label class="field-stack">
        <span class="field-label">生产接口</span>
        <select id="loopInterface">
          <option value="legacy">旧版接口（每小时5个）</option>
          <option disabled>新接口（每小时20个）</option>
        </select>
      </label>
      <fieldset class="field-stack loop-mode-field">
        <legend class="field-label">运行模式</legend>
        <div class="segmented" id="loopMode">
          <label><input type="radio" name="loopMode" value="forever" checked><span>无限</span></label>
          <label><input type="radio" name="loopMode" value="timed"><span>定时</span></label>
        </div>
      </fieldset>
      <label id="loopDurationField" class="field-stack">
        <span class="field-label">运行分钟</span>
        <input id="loopDuration" type="number" min="1" step="1" value="30">
      </label>
      <label class="field-stack">
        <span class="field-label">轮次间隔（秒）</span>
        <input id="loopInterval" type="number" min="1" max="60" step="1" value="2">
      </label>
      <div class="loop-actions">
        <button class="btn btn-primary" type="submit" id="loopStart">开始</button>
        <button class="btn btn-danger" type="button" id="loopStop" disabled>停止</button>
        <button class="btn btn-ghost" type="button" id="loopRefresh">刷新</button>
      </div>
    </form>
  </section>

  <section class="loop-account-band">
    <div class="col-head">
      <div class="loop-heading"><h2>参与账号</h2><span id="loopSelectionCount" class="badge">0 个</span></div>
      <div class="loop-list-actions">
        <button id="loopSelectReady" class="btn btn-ghost" type="button">全选可用</button>
        <button id="loopClearSelection" class="btn btn-ghost" type="button">清空</button>
      </div>
    </div>
    <div class="loop-table-wrap">
      <table class="loop-account-table">
        <thead><tr><th class="loop-check-col">参与</th><th>iCloud 账号</th><th>状态</th><th>总量</th><th>本小时</th><th>剩余</th><th>上次生产</th><th>下次可生产</th><th>操作</th></tr></thead>
        <tbody id="loopAccountRows"></tbody>
      </table>
    </div>
  </section>

  <section class="loop-runtime-band">
    <div class="loop-summary-pane">
      <div class="col-head"><h2>运行状态</h2><span id="loopRound" class="badge">第 0 轮</span></div>
      <dl class="loop-status-list">
        <div><dt>当前账号</dt><dd id="loopCurrentAccount">-</dd></div>
        <div><dt>当前任务</dt><dd id="loopCurrentJob">-</dd></div>
        <div><dt>最近账号</dt><dd id="loopLastAccount">-</dd></div>
        <div><dt>最近任务</dt><dd id="loopLastJob">-</dd></div>
        <div><dt>最近链路</dt><dd id="loopLastNetwork">-</dd></div>
        <div><dt>最近结果</dt><dd id="loopLastOutcome">-</dd></div>
        <div><dt>启动时间</dt><dd id="loopStartedAt">-</dd></div>
        <div><dt>截止时间</dt><dd id="loopDeadline">-</dd></div>
        <div><dt>下次轮询</dt><dd id="loopNextRun">-</dd></div>
      </dl>
      <div class="loop-counters">
        <div><span>提交</span><b id="loopSubmitted">0</b></div>
        <div><span>成功</span><b id="loopCreated">0</b></div>
        <div><span>失败</span><b id="loopFailed">0</b></div>
        <div><span>跳过</span><b id="loopSkipped">0</b></div>
      </div>
      <div id="loopJobProgress" class="loop-job-progress"></div>
    </div>
    <div class="loop-log-pane">
      <div class="col-head"><h2>轮询日志</h2><span id="loopLogCount" class="badge">0 条</span></div>
      <div id="loopLogs" class="loop-logs"></div>
    </div>
  </section>
</main>

<div id="loopToast" class="toast hidden"></div>
<div id="settingsMask" class="settings-mask hidden"></div>
<aside id="settingsPanel" class="settings-panel hidden" role="dialog" aria-labelledby="settingsTitle">
  <div class="settings-head">
    <h2 id="settingsTitle">界面设置</h2>
    <button id="settingsClose" class="btn-icon" type="button" title="关闭">×</button>
  </div>
  <div class="settings-body">
    <label class="field-stack"><span class="field-label">显示时区</span><select id="settingsUtcOffset"></select></label>
    <p class="settings-hint">服务端、数据库和风控使用 UTC+0。</p>
    <p class="settings-preview">当前显示：<b id="settingsTimePreview"></b></p>
  </div>
</aside>
<script src="/static/settings.js"></script>
<script src="/static/production_loop.js?v=20260909-1"></script>
</body>
</html>
