<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ app_name }} · 生产</title>
<link rel="stylesheet" href="/static/app.css?v=20260828-3">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo">+</span><div><div class="brand-name">{{ app_name }}</div><div class="brand-sub">隐私邮箱生产</div></div></div>
  <nav class="page-nav"><a href="/">首页</a><a href="/mailbox">邮箱池子</a><a class="active" href="/production">生产</a><a href="/production-loop">轮询生产</a></nav>
  <div class="topbar-actions">
    <button id="btnSettings" class="btn btn-ghost" type="button" aria-expanded="false" title="界面设置">设置</button>
  </div>
</header>
<main class="production-layout">
  <section class="production-panel">
    <div class="col-head"><h1>生产隐私邮箱</h1><span class="badge">按 iCloud 账号独立限流</span></div>
    <form id="productionForm" class="production-form">
      <label class="field-stack"><span class="field-label">iCloud 账号</span><select id="productionAccount" required></select></label>
      <label class="field-stack"><span class="field-label">生产接口</span><select id="productionInterface"><option value="legacy">旧版接口（每小时5个）</option><option disabled>新接口（每小时20个）</option></select></label>
      <label class="field-stack"><span class="field-label">生产数量</span><input id="productionCount" type="number" min="1" max="1" value="1" required></label>
      <label class="field-stack"><span class="field-label">并发线程</span><input id="productionThreads" type="number" min="1" max="5" value="1" required></label>
      <div id="productionQuota" class="quota-panel"></div>
      <button class="btn btn-primary" type="submit" id="productionStart">开始生产</button>
    </form>
  </section>
  <section class="production-panel production-status">
    <div class="col-head"><h2>任务状态</h2><button class="btn btn-ghost" id="productionRefresh">同步状态</button></div>
    <div id="productionJobs" class="production-jobs"></div>
  </section>
</main>
<div id="productionToast" class="toast hidden"></div>
<div id="settingsMask" class="settings-mask hidden"></div>
<aside id="settingsPanel" class="settings-panel hidden" role="dialog" aria-labelledby="settingsTitle">
  <div class="settings-head">
    <h2 id="settingsTitle">界面设置</h2>
    <button id="settingsClose" class="btn-icon" type="button" title="关闭">×</button>
  </div>
  <div class="settings-body">
    <label class="field-stack">
      <span class="field-label">显示时区</span>
      <select id="settingsUtcOffset"></select>
    </label>
    <p class="settings-hint">只改网页时间显示。服务端、数据库和风控仍按 UTC+0。</p>
    <p class="settings-preview">当前显示：<b id="settingsTimePreview"></b></p>
  </div>
</aside>
<script src="/static/settings.js"></script>
<script src="/static/production.js?v=20260828-4"></script>
</body>
</html>
