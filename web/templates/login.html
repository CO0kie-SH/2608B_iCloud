<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ app_name }} · 登录</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="login-body">
<main class="login-page">
  <section class="login-card">
    <div class="login-brand">
      <span class="logo">⌂</span>
      <div>
        <div class="brand-name">{{ app_name }}</div>
        <div class="brand-sub">工作台登录</div>
      </div>
    </div>
    <h1>账号登录</h1>
    <p class="login-lead">使用分配的工作台账号进入本地管理界面。</p>
    {% if error %}
    <div class="login-error" role="alert">{{ error }}</div>
    {% endif %}
    <form method="post" action="/login" class="login-form" autocomplete="on">
      <input type="hidden" name="next" value="{{ next_path }}">
      <label class="field-stack">
        <span class="field-label">用户名</span>
        <input name="username" type="text" required autofocus autocomplete="username" placeholder="用户名">
      </label>
      <label class="field-stack">
        <span class="field-label">密码</span>
        <input name="password" type="password" required autocomplete="current-password" placeholder="密码">
      </label>
      <button class="btn btn-primary login-submit" type="submit">登录</button>
    </form>
  </section>
</main>
</body>
</html>
